[profile_defaults]
domain = "adaptive"
mode = "adaptive"

[[domain_profiles]]
name = "adaptive"
system_prompt = "Classify the task as Oracle of Secrets hacked-code work, vanilla ALTTP disassembly work, or cross-reference work before proceeding."

[[domain_profiles]]
name = "oos"
keywords = ["oracle of secrets", "oos", "custom hook", "zsow", "bank $", "patch", "asm patch"]
system_prompt = """Domain profile: Oracle of Secrets hacked-code work.
Prefer Oracle-specific systems, hooks, and project conventions unless the prompt explicitly asks for vanilla behavior."""

[[domain_profiles]]
name = "alttp-vanilla"
keywords = ["vanilla", "alttp disassembly", "usdasm", "jpdasm", "vanilla trace", "rom map"]
system_prompt = """Domain profile: vanilla ALTTP disassembly.
Preserve vanilla assumptions, and do not invent Oracle-specific hooks or hacked-code conventions."""

[[domain_profiles]]
name = "xref"
keywords = ["cross reference", "xref", "compare vanilla", "vanilla vs oracle", "diff vanilla", "map between"]
system_prompt = """Domain profile: vanilla-to-Oracle cross-reference.
Compare vanilla and hacked flows explicitly, and keep the two conventions separated."""

[[mode_profiles]]
name = "adaptive"
system_prompt = "Choose whether the task is trace, debug, or authoring work before answering."

[[mode_profiles]]
name = "trace"
keywords = ["trace", "explain", "read", "inspect", "map", "walk through", "disassemble"]
system_prompt = """Mode profile: trace.
Prioritize reading and explanation. Do not jump into patch authoring unless explicitly requested."""

[[mode_profiles]]
name = "debug"
keywords = ["debug", "bug", "crash", "regression", "breakpoint", "repro", "triage", "investigate"]
system_prompt = """Mode profile: debug.
Gather evidence first (state, traces, breakpoints, repro conditions) before proposing a fix."""

[[mode_profiles]]
name = "author"
keywords = ["implement", "patch", "write", "add hook", "refactor", "edit", "change code"]
system_prompt = """Mode profile: author.
Produce concrete patches or edits after constraints are clear, and verify expected behavior."""

[[routers]]
name = "oracle"
description = "Canonical Oracle router with `oracle` as the public default and specialist routing kept internal where it still adds value."
strategy = "keyword"
default_model = "oracle"

[[routers.rules]]
keywords = ["cross reference", "cross-reference", "xref", "compare vanilla", "vanilla vs oracle", "alttp disassembly", "usdasm", "jpdasm"]
model = "oracle"

[[routers.rules]]
keywords = ["optimize", "faster", "performance", "cycles", "tighten"]
model = "din"

[[routers.rules]]
keywords = ["refactor", "rewrite", "cleanup"]
model = "din"

[[routers.rules]]
keywords = ["explain", "document", "describe", "what does", "why", "teach"]
model = "nayru"

[[routers.rules]]
keywords = ["autocomplete", "fim", "fill in", "snippet", "quick"]
model = "farore"
