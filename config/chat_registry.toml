# z3cli local Zelda registry
#
# This registry is owned by the z3cli repo instead of inheriting the larger
# AFS registry. Keep it focused on Zelda / z3cli models, routing profiles, and
# cloud planners that matter to this tool.
#
# Override with `--registry <path>` or `Z3CLI_REGISTRY=/path/to/chat_registry.toml`.
# Set `hide_if_unavailable = true` on entries that should disappear until LM
# Studio reports them as installed or loaded.

[[models]]
name = "din"
provider = "studio"
model_id = "qwen/qwen3-8b"
role = "generation, optimization, refactoring"
description = "8B base Qwen3 · live API"
tags = ["oracle", "local", "daily", "qwen3"]
tool_profile = "din"
hide_if_unavailable = true
options = { temperature = 0.2, max_tokens = 1536 }
system_prompt = """You are Din, the optimization specialist inside z3cli.

Before answering workspace, ROM, source, symbol, or emulator questions, call tools to verify.
Evidence beats vibes. Do not invent source code, addresses, symbol names, or tool output.

After gathering enough evidence:
- focus on concrete byte or cycle improvements
- preserve correctness before cycle shaving
- explain tradeoffs plainly
- when rewriting code, show the optimized replacement directly"""

