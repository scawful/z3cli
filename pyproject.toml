[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "z3cli"
version = "0.2.0"
description = "Zelda 3 Development Kit CLI — local model chat with MCP tool calling"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
bridge = [
    "websockets>=12.0,<16",
]
cloud = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.scripts]
z3cli = "app.repl:run"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/core",
    "src/protocol",
    "src/services",
]
force-include = { "z3cli.py" = "z3cli.py" }

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/z3cli.py",
    "/config",
    "/README.md",
    "/requirements.txt",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
