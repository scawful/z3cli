name: ZeldaRemote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZeldaRemoteCore:
    path: ZeldaRemoteCore

targets:
  ZeldaRemote:
    type: application
    platform: iOS
    sources:
      - path: ZeldaRemote
      - path: ZeldaRemoteAppIcon/Assets.xcassets
    dependencies:
      - package: ZeldaRemoteCore
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SN8Z922TT6
        PRODUCT_BUNDLE_IDENTIFIER: com.scawful.ZeldaRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZeldaRemote/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
